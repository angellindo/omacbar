[workspace]
resolver = "3"
members = ["crates/tb-core", "crates/tb-render", "crates/tb-app", "crates/tb-daemon", "crates/tb-config"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
tb-core = { path = "crates/tb-core" }
tb-render = { path = "crates/tb-render" }
# Rune is pre-release: always pin a `dev` rev (never a branch). Bump in its own ticket.
rune = { git = "https://github.com/anomalyco/rune", rev = "f73f72cdc563534e4f7de9f5a79bed007ac42384", default-features = false, features = ["embedded-fonts"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
png = "0.17"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints we consciously opt out of (see docs/standards/coding-standards.md).
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"

[profile.dev.package."*"]
debug = false
opt-level = 1
