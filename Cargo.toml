[workspace]
resolver = "3"
members = ["crates/tb-core", "crates/tb-render", "crates/tb-app", "crates/tb-daemon", "crates/tb-config"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
tb-core = { path = "crates/tb-core" }
tb-render = { path = "crates/tb-render" }
tb-config = { path = "crates/tb-config" }
# Rune is pre-release: always pin a `dev` rev (never a branch). Bump in its own ticket.
rune = { git = "https://github.com/anomalyco/rune", rev = "22ebd7e7f5ceb189e1829f066b5ba0fe31ed5598", default-features = false, features = ["embedded-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
thiserror = "2"
png = "0.17"
# Safe inotify for the config watch (ADR-0007); already locked via Rune's deps.
rustix = { version = "1.1", features = ["fs"] }
# Hash of kept config generations (ADR-0015); already locked via Rune's deps.
blake3 = { version = "1.8", default-features = false }

# Rune's own crates.io patches do not propagate to apps that depend on it.
# Use the same public Git revision for Rune and these patches, and update them together.
[patch.crates-io]
naga = { git = "https://github.com/anomalyco/rune", rev = "22ebd7e7f5ceb189e1829f066b5ba0fe31ed5598" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "22ebd7e7f5ceb189e1829f066b5ba0fe31ed5598" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "22ebd7e7f5ceb189e1829f066b5ba0fe31ed5598" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "22ebd7e7f5ceb189e1829f066b5ba0fe31ed5598" }
winit = { git = "https://github.com/anomalyco/rune", rev = "22ebd7e7f5ceb189e1829f066b5ba0fe31ed5598" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints we consciously opt out of (see docs/standards/coding-standards.md).
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"

[profile.dev.package."*"]
debug = false
opt-level = 1
