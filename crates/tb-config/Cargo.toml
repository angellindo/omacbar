[package]
name = "tb-config"
description = "The files the bar follows on disk: the config file (load, validate, save atomically, watch) and the active Omarchy theme (load, watch for a switch)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Terminal recovery of a chosen generation (ADR-0015); no Rune or GPU in its graph.
[[bin]]
name = "touchbar-recover"
path = "src/bin/touchbar-recover/main.rs"

[dependencies]
tb-core.workspace = true
thiserror.workspace = true
# `event` for cancellable watches, `process` for the effective uid, `rand` for staging directories.
rustix = { workspace = true, features = ["event", "process", "rand"] }
serde.workspace = true
toml.workspace = true
blake3.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
