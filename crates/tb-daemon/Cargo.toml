[package]
name = "tb-daemon"
description = "touchbard: renders the shown layer on change and presents frames with their damage to a display backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "touchbard"
path = "src/main.rs"

[[bin]]
name = "touchbar-doctor-probe"
path = "src/doctor.rs"

[dependencies]
libc = "0.2"
serde.workspace = true
serde_json = "1"
tb-core.workspace = true
tb-config.workspace = true
tb-render.workspace = true
rune.workspace = true
# `mm`: the KMS dumb-buffer mapping (ADR-0014); rustix 1.1.6 is already locked.
rustix = { workspace = true, features = ["event", "mm"] }
thiserror.workspace = true

[dev-dependencies]
png.workspace = true

[lints]
workspace = true
